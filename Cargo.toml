[package]
name = "mde"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Layer 5 Improved MCP protocol and local Tree-sitter CST broker for Siliconcordat"
repository = "https://github.com/siliconcordat/mde"

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.24"
tree-sitter-c = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3"
